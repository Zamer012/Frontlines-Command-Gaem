name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Project Dependencies
      run: npm install

    - name: Install Capacitor Packages On-The-Fly
      run: npm install @capacitor/core @capacitor/android @capacitor/cli

    - name: Compile Vite Web Application
      run: npm run build

    - name: Initialize Capacitor Configuration
      run: npx cap init "Frontline Command" "com.yourname.frontlinecommand" --web-dir=dist

    - name: Add Android Platform and Sync
      run: |
        npx cap android add
        npx cap sync

    - name: Build Debug APK with Gradle
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: frontline-command-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
        
